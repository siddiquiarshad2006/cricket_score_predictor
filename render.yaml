services:
  - type: web
    name: cricket-score-predictor
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "sh setup.sh && streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.enableCORS=false --server.enableXsrfProtection=false"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
